<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Planning La Bocca</title>
<script>window.STANDALONE=true;</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Mise en page : rail de navigation à gauche, barre du jour (date en grand), bandeau d'en-tête limité à ~15 % de la hauteur, liste des chantiers en lignes serrées sur toute la largeur, bandeau du bas persistant. Esprit fiche technique : fond blanc cassé, noir, or. */
:root{
  --bg:#f2f1ee; --panel:#fbfbf9; --sunk:#e9e8e3; --line:#dcdad3; --line-strong:#c4c1b8;
  --ink:#141413; --muted:#66655f; --faint:#9a988f;
  --gold:#a8832f; --gold-soft:#efe3c6;
  --stabilo:#f3d699; --stabilo-ink:#563706; --stabilo-line:#cf9c3f;
  --f-beton:#e6e5e0; --f-chape:#dce6f0; --f-desac:#f1e4cb; --f-sable:#e2e9d4;
  --warn:#f7e6b3; --warn-ink:#654b00; --bad:#f4d6d1; --bad-ink:#8a2a1d; --ok:#d9ead6; --ok-ink:#2b602f; --info:#dfe7f1; --info-ink:#284a73;
  --edit:#dbe3fb; --edit-ink:#1f3f9a;
  --accent:#141413; --accent-ink:#fbfbf9;
  --shadow:0 12px 32px rgba(20,20,18,.16);
  --ui:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --headH:clamp(78px,14vh,124px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111110; --panel:#191917; --sunk:#22221f; --line:#2c2c29; --line-strong:#3e3e3a;
  --ink:#ecebe6; --muted:#a4a39c; --faint:#6f6e68;
  --gold:#d2b066; --gold-soft:#3a3019;
  --stabilo:#6d5120; --stabilo-ink:#f8e4b8; --stabilo-line:#b98d3f;
  --f-beton:#262623; --f-chape:#1e2934; --f-desac:#372c1b; --f-sable:#242c1b;
  --warn:#3a3114; --warn-ink:#f1d98e; --bad:#3b1f1b; --bad-ink:#f2b3a9; --ok:#1d321f; --ok-ink:#a8dba9; --info:#1c2a3b; --info-ink:#b7cdf0;
  --edit:#1d2b52; --edit-ink:#c3d2ff;
  --accent:#ecebe6; --accent-ink:#111110; --shadow:0 12px 32px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111110; --panel:#191917; --sunk:#22221f; --line:#2c2c29; --line-strong:#3e3e3a;
  --ink:#ecebe6; --muted:#a4a39c; --faint:#6f6e68;
  --gold:#d2b066; --gold-soft:#3a3019;
  --stabilo:#6d5120; --stabilo-ink:#f8e4b8; --stabilo-line:#b98d3f;
  --f-beton:#262623; --f-chape:#1e2934; --f-desac:#372c1b; --f-sable:#242c1b;
  --warn:#3a3114; --warn-ink:#f1d98e; --bad:#3b1f1b; --bad-ink:#f2b3a9; --ok:#1d321f; --ok-ink:#a8dba9; --info:#1c2a3b; --info-ink:#b7cdf0;
  --edit:#1d2b52; --edit-ink:#c3d2ff;
  --accent:#ecebe6; --accent-ink:#111110; --shadow:0 12px 32px rgba(0,0,0,.55); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14.5px;line-height:1.3;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--edit-ink);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted,small{color:var(--muted)}
.lbl{font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* ---------- ossature ---------- */
.app{display:grid;grid-template-columns:176px minmax(0,1fr);height:100%}
.side{display:flex;flex-direction:column;gap:2px;padding:14px 10px max(14px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--bg);min-height:0;overflow:auto}
.brand{padding:2px 8px 16px;display:flex;flex-direction:column;gap:3px}
.brand b{font-size:18px;font-weight:700;letter-spacing:.02em;line-height:1}
.brand span{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.nav-b{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;text-align:left;padding:8px 10px;border-radius:7px;font-weight:600;color:var(--muted);font-size:15px}
.nav-b:hover{background:var(--sunk);color:var(--ink)}
.nav-b.on{background:var(--ink);color:var(--bg)}
.nav-b.main{font-size:16.5px;color:var(--ink);margin-bottom:10px}
.nav-b.main.on{color:var(--bg)}
.nav-b .n{font:600 11px var(--mono);background:var(--warn);color:var(--warn-ink);border-radius:9px;padding:0 6px;min-width:18px;text-align:center}
.nav-sep{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:4px 10px 4px}
.side .grow{flex:1}
.side .mini{display:flex;flex-direction:column;gap:6px;padding:8px;font-size:12.5px;color:var(--muted)}
.work{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}

/* ---------- barre du jour ---------- */
.top{display:flex;align-items:center;gap:10px 14px;padding:8px max(14px,env(safe-area-inset-right,0px)) 8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;padding-top:max(8px,env(safe-area-inset-top,0px))}
.t-date{display:flex;align-items:center;gap:8px;min-width:0}
.bigdate{display:flex;flex-direction:column;line-height:1;min-width:0}
.bigdate .d{font-size:clamp(24px,2.6vw,34px);font-weight:700;letter-spacing:-.01em;white-space:nowrap;text-transform:capitalize}
.bigdate .w{white-space:nowrap;font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px;display:flex;gap:10px;align-items:center}
.bigdate .w em{font-style:normal;color:var(--stabilo-ink);background:var(--stabilo);padding:1px 6px;border-radius:3px}
.ib{width:32px;height:32px;border-radius:7px;border:1px solid var(--line-strong);display:inline-grid;place-items:center;font-size:18px;line-height:1;flex:none}
.ib:hover,.btn:hover{background:var(--sunk)}
.btn{height:32px;padding:0 12px;border-radius:7px;border:1px solid var(--line-strong);font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{opacity:.88;background:var(--accent)}
.btn.sm{height:26px;padding:0 9px;font-size:13px}
.btn.ghost{border-color:transparent}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden}
.seg button{height:30px;padding:0 12px;font-weight:600;font-size:14px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.spacer{flex:1}
.search{position:relative;min-width:0;flex:0 1 210px}
.search input{width:100%;height:32px;border:1px solid var(--line-strong);border-radius:7px;padding:0 10px;background:var(--panel)}
.qres{position:absolute;top:38px;right:0;width:min(380px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;z-index:30;padding:6px}
.qres button{display:grid;grid-template-columns:86px 1fr;gap:8px;width:100%;text-align:left;padding:7px 8px;border-radius:6px}
.qres button:hover{background:var(--sunk)}
.sync{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:13px;font-size:12.5px;font-weight:600;white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:4px;background:currentColor}
.s-ok{background:var(--ok);color:var(--ok-ink)} .s-bad{background:var(--bad);color:var(--bad-ink)} .s-wait{background:var(--warn);color:var(--warn-ink)} .s-local{background:var(--info);color:var(--info-ink)}
.who{display:flex;align-items:center}
.av{height:26px;min-width:26px;padding:0 6px;border-radius:13px;display:inline-grid;place-items:center;font-size:11.5px;font-weight:700;border:1.5px solid var(--bg);margin-left:-6px;background:var(--sunk);color:var(--ink)}
.av:first-child{margin-left:0}
.r-centraliste{background:var(--stabilo);color:var(--stabilo-ink)}
.r-commercial{background:var(--info);color:var(--info-ink)}
.r-labo{background:var(--ok);color:var(--ok-ink)}
.me{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:14px;flex:none;box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:5px 14px;font-size:13px;border-bottom:1px solid var(--line);background:var(--warn)}

/* ---------- bandeau d'en-tête (≈15 %) ---------- */
.head{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.25fr) minmax(0,1.6fr);gap:8px;padding:8px 14px 0;flex:none}
.hb-w{position:relative;height:var(--headH);min-width:0}
.hb{position:absolute;inset:0 0 auto 0;max-height:var(--headH);overflow:hidden;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:7px 10px 9px;display:flex;flex-direction:column;gap:5px;transition:max-height .18s ease .12s,box-shadow .18s;z-index:5}
.hb::after{content:"";position:absolute;left:0;right:0;bottom:0;height:18px;background:linear-gradient(transparent,var(--panel));pointer-events:none}
.hb:hover,.hb.open,.hb:focus-within{max-height:72vh;overflow:auto;z-index:16;box-shadow:var(--shadow);border-color:var(--line-strong)}
.hb:hover::after,.hb.open::after,.hb:focus-within::after{display:none}
.hb-h{display:flex;align-items:center;justify-content:space-between;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:23px;padding:1px 8px;border-radius:999px;border:1px solid var(--line-strong);font-size:12.5px;background:var(--panel);text-align:left;max-width:100%;white-space:nowrap}
button.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--stabilo);border-color:var(--stabilo-line);color:var(--stabilo-ink)}
.chip.warn{background:var(--warn);border-color:transparent;color:var(--warn-ink)}
.chip.bad{background:var(--bad);border-color:transparent;color:var(--bad-ink)}
.chip.ok{background:var(--ok);border-color:transparent;color:var(--ok-ink)}
.chip.info{background:var(--info);border-color:transparent;color:var(--info-ink)}
.chip.dash{border-style:dashed}
.chip.add{border-style:dashed;color:var(--muted)}
.chip small{color:inherit;opacity:.72;font-size:11.5px}
.chip .x{margin-left:1px;width:16px;height:16px;border-radius:8px;display:inline-grid;place-items:center;font-size:13px;line-height:1;opacity:.5}
.chip .x:hover{opacity:1;background:var(--sunk)}
.sl{display:flex;align-items:center;gap:4px;min-height:24px;flex-wrap:wrap}
.s-name{font-weight:700;font-size:13px;min-width:74px;text-align:left;white-space:nowrap}
.s-name small{font-weight:500;margin-left:3px}
.s-h{font:600 12px var(--mono);color:var(--muted);min-width:42px}
.s-t{display:inline-flex;align-items:baseline;gap:4px;height:23px;padding:0 8px;border-radius:6px;border:1px solid var(--line-strong);font:600 12.5px var(--mono);white-space:nowrap}
.s-t small{font:500 10px var(--mono);letter-spacing:.04em}
.s-t.on{background:var(--stabilo);border-color:var(--stabilo-line);color:var(--stabilo-ink)}
.s-t.on small{color:var(--stabilo-ink)}
.s-add{height:23px;width:23px;border-radius:6px;border:1px dashed var(--line-strong);color:var(--muted);font-size:15px;line-height:1}
.s-add:hover{border-color:var(--ink);color:var(--ink)}
.s-cg{display:inline-flex;align-items:center;gap:3px;margin-right:8px}
.s-cg b{font:700 12.5px var(--mono);margin-right:2px}
.s-note{font-size:12px;color:var(--muted);font-style:italic}

/* ---------- liste des chantiers ---------- */
.list{flex:1;min-height:0;overflow:auto;padding:6px 14px 10px;padding-right:max(14px,env(safe-area-inset-right,0px))}
.cols{--c:46px minmax(90px,1fr) minmax(110px,1.2fr) minmax(100px,1fr) minmax(86px,.8fr) minmax(150px,1.7fr) 70px minmax(110px,1.25fr) 26px}
.lh,.row{display:grid;grid-template-columns:var(--c);column-gap:10px;align-items:center}
.lh{position:sticky;top:0;z-index:3;background:var(--bg);padding:5px 6px 4px 9px;border-bottom:1px solid var(--line-strong)}
.lh span{font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.lh .r{text-align:right}
.half-l{display:flex;align-items:center;gap:10px;margin:0;padding:5px 2px 3px;font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.half-l::after{content:"";flex:1;height:1px;background:var(--line-strong)}
.half-l.pm{margin-top:4px;color:var(--ink)}
.half-l.pm::after{height:2px;background:var(--ink)}
.row{position:relative;min-height:34px;padding:3px 6px 3px 7px;border-bottom:1px solid var(--line);border-left:3px solid var(--line-strong);background:var(--panel)}
.row:hover{background:var(--bg)}
.row.st-encours{border-left-color:var(--stabilo-line)}
.row.st-terminee{border-left-color:var(--faint)}
.row.st-annulee{border-left-color:var(--bad-ink)}
.row.st-annulee>*:not(.r-menu):not(.editby){opacity:.45}
.row.st-annulee .r-client,.row.st-annulee .r-site{text-decoration:line-through}
.row.kind-pour{background:repeating-linear-gradient(135deg,var(--panel) 0 10px,var(--sunk) 10px 11px);border-left-style:dashed}
.row.editing{box-shadow:inset 0 0 0 2px var(--edit-ink)}
.row.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%{background:var(--stabilo)}100%{background:var(--panel)}}
.c{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-time{font:600 13.5px var(--mono);font-variant-numeric:tabular-nums}
.r-client{font-weight:700;font-size:14.5px;text-align:left;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-site{text-decoration:none;font-size:14px}
.r-site:hover{text-decoration:underline}
.r-site.adr{color:var(--muted)}
.tag{display:inline-block;font:600 10px var(--mono);letter-spacing:.05em;padding:1px 5px;border-radius:4px;border:1px solid var(--line-strong);margin-left:5px;vertical-align:1px;color:var(--muted)}
.tag.pay{border-color:transparent;background:var(--bad);color:var(--bad-ink)}
.tag.pay.ok{background:var(--stabilo);color:var(--stabilo-ink)}
.tag.pour{border-color:transparent;background:var(--info);color:var(--info-ink)}
.tag.spec{border-color:transparent;background:var(--gold-soft);color:var(--gold)}
.r-form{max-width:100%;text-align:left;padding:3px 7px;border-radius:5px;font:500 12.5px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid transparent}
.r-form:hover{border-color:var(--line-strong)}
.r-form.att{background:var(--warn);color:var(--warn-ink)}
.fam-beton{background:var(--f-beton)} .fam-chape{background:var(--f-chape)} .fam-desac{background:var(--f-desac)} .fam-sable{background:var(--f-sable)}
.r-mo{display:flex;gap:4px;align-items:center;overflow:hidden;white-space:nowrap}
.mo{font:600 11.5px var(--mono);padding:2px 6px;border-radius:5px;border:1px solid var(--line-strong);white-space:nowrap}
button.mo.on{background:var(--stabilo);border-color:var(--stabilo-line);color:var(--stabilo-ink)}
button.mo.warn{background:var(--warn);border-color:transparent;color:var(--warn-ink)}
.mo.bad{background:var(--bad);border-color:transparent;color:var(--bad-ink)}
.r-tours{display:flex;flex-wrap:wrap;gap:3px;align-items:center;padding:2px 0}
.t{height:24px;min-width:24px;padding:0 5px;border-radius:12px;border:1.5px solid var(--line-strong);display:inline-flex;align-items:center;justify-content:center;gap:2px;font:600 10.5px var(--mono);color:var(--muted);flex:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;position:relative;white-space:nowrap}
.t:hover{border-color:var(--ink)}
.t.on{background:var(--stabilo);border-color:var(--stabilo-line);color:var(--stabilo-ink)}
.t.cp{border-style:dashed}
.t sub{font-size:9.5px;vertical-align:0;opacity:.85}
.t.ext{font-family:var(--ui);font-size:11.5px;padding:0 7px}
.t.ext.on{background:var(--info);border-color:var(--info-ink);color:var(--info-ink)}
.t.xtra::after{content:"+";position:absolute;top:-7px;right:-3px;font:700 10px var(--ui);color:var(--gold)}
.t-add{height:24px;width:24px;border-radius:12px;border:1.5px dashed var(--line-strong);color:var(--muted);font-size:15px;line-height:1;display:inline-grid;place-items:center}
.t-add:hover{border-color:var(--ink);color:var(--ink)}
.r-vol{text-align:right;font:500 13px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.r-vol b{font-weight:700;font-size:14px}
.r-vol.over b{color:var(--bad-ink)}
.r-pills{display:flex;flex-wrap:wrap;gap:3px;align-items:center;min-width:0;padding:2px 0}
.r-pills .chip{min-height:21px;font-size:12px;padding:0 7px}
.r-menu{width:26px;height:26px;border-radius:6px;font-size:18px;line-height:1;color:var(--muted)}
.r-menu:hover{background:var(--sunk);color:var(--ink)}
.editby{position:absolute;right:34px;top:-9px;font-size:11px;font-weight:600;background:var(--edit);color:var(--edit-ink);border-radius:5px;padding:0 7px;white-space:nowrap;z-index:2}
.now{position:relative;height:0;border-top:2px solid var(--bad-ink);margin-left:-3px;z-index:2}
.now span{position:absolute;left:0;top:-9px;background:var(--bad-ink);color:var(--panel);font:600 10.5px var(--mono);padding:0 5px;border-radius:3px}
.cont{display:flex;gap:10px;align-items:center;width:100%;min-height:26px;padding:2px 9px;border-bottom:1px solid var(--line);border-left:3px dashed var(--stabilo-line);color:var(--muted);font-size:13px;text-align:left;background:var(--panel)}
.cont b{color:var(--ink)}
.empty{color:var(--faint);padding:10px 8px;font-size:13.5px;margin:0}

/* ---------- bandeau du bas ---------- */
.foot{flex:none;display:flex;align-items:center;gap:8px 16px;min-height:40px;padding:5px 14px max(5px,env(safe-area-inset-bottom,0px));padding-right:max(14px,env(safe-area-inset-right,0px));border-top:1px solid var(--line-strong);background:var(--panel);overflow:hidden}
.ft{display:flex;align-items:baseline;gap:5px;white-space:nowrap;font-size:13px;color:var(--muted)}
.ft b{font:700 15px var(--mono);color:var(--ink)}
.ft.big b{font-size:19px}
.watch{display:flex;gap:4px;align-items:center;overflow:hidden;flex:1;min-width:0;mask-image:linear-gradient(90deg,#000 88%,transparent)}
.watch .chip{flex:none}
.legend{display:flex;gap:10px;font-size:12px;color:var(--muted);white-space:nowrap;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:6px;border:1.5px solid var(--line-strong);vertical-align:-2px;margin-right:4px}
.legend i.on{background:var(--stabilo);border-color:var(--stabilo-line)}
.legend i.cp{border-style:dashed}

/* ---------- vue semaine ---------- */
.wk-scroll{overflow-x:auto;padding-bottom:6px}
.wk{display:grid;gap:6px;min-width:100%}

.card.st-encours{border-left-color:var(--stabilo-line)} .card.st-annulee{opacity:.5;text-decoration:line-through} .card.st-terminee{border-left-color:var(--faint)}

.panel{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--panel)}

.cell{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;min-height:30px;text-align:left;padding:2px 5px;border-radius:5px}
.cell:hover{background:var(--sunk)}
.cell b{font:600 13px var(--mono)}
.cell .dep{font-size:11.5px;padding:0 5px;border-radius:4px;background:var(--info);color:var(--info-ink)}
.cell .aff{font-size:11.5px;color:var(--muted)}
.adj-line{display:flex;align-items:center;gap:8px;padding:4px 0;border-top:1px solid var(--line)}

.inline-f{display:flex;gap:6px}

.year td{border-bottom:1px solid var(--line);padding:4px 8px;vertical-align:top}

.year tr.cur td{background:var(--gold-soft)}
.links{display:flex;flex-direction:column}
.lk{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}

/* ---------- popover, tiroir, accès ---------- */
.pop-list{display:grid;gap:2px;max-height:260px;overflow:auto;margin:4px 0}.pop-list .pop-b b{font-family:var(--mono,monospace);margin-right:4px}
.pop-cf{display:flex;gap:6px;margin-top:4px}.pop-cf .btn{flex:1}.btn.danger{background:var(--bad);color:var(--bad-ink);border-color:var(--bad-ink)}
.r-tours .t.mv,.r-tours .t.rf,.t.on.mv,.t.on.rf{background:color-mix(in srgb,#2f6fd6 28%,var(--panel));border-color:#2f6fd6;color:var(--ink)}.t.mv{opacity:.75;text-decoration:line-through}.t.rf::before{content:"↪";font:700 9px var(--ui);margin-right:1px}.t.mv::after{content:"→";position:absolute;top:-8px;right:-4px;font:700 11px var(--ui);color:#2f6fd6}

.pop{position:fixed;z-index:50;width:max-content;min-width:230px;max-width:min(360px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--line-strong);border-radius:11px;box-shadow:var(--shadow);padding:10px;max-height:74vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
.pop-h{font-weight:700;font-size:15px}

.pop-b{text-align:left;padding:6px 8px;border-radius:6px;font-size:14px}
.pop-b:hover{background:var(--sunk)}

.pop-b.danger{color:var(--bad-ink)}
.pop-grid{display:flex;flex-wrap:wrap;gap:4px}

.pop form{display:flex;flex-direction:column;gap:7px}
.pop .row2{display:flex;gap:6px}
.pop .row2>*{flex:1}
.fl{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted)}
.fl input,.fl select,.fl textarea{height:32px;border:1px solid var(--line-strong);border-radius:7px;padding:0 9px;background:var(--bg);color:var(--ink);font-size:15px;width:100%;min-width:0}
.ck{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.ck input{width:18px;height:18px}
.cal{display:grid;grid-template-columns:repeat(7,36px);gap:3px}
.cal .wd{font:500 10.5px var(--mono);color:var(--faint);text-align:center}
.cal button{height:33px;border-radius:6px;font:500 13px var(--mono);position:relative}
.cal button:hover{background:var(--sunk)}
.cal button.td{box-shadow:inset 0 0 0 1.5px var(--gold);font-weight:700}
.cal button.we{color:var(--faint)}
.cal button.has::after{content:"";position:absolute;bottom:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:2px;background:var(--muted)}
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:6px}
.scrim{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--ink) 30%,transparent);display:flex;justify-content:flex-end}
.drawer{width:min(560px,100%);height:100%;background:var(--panel);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);box-shadow:var(--shadow);display:flex;flex-direction:column}
.dr-h{position:sticky;top:0;background:var(--panel);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);z-index:2}
.dr-h h2{margin:0;font-size:20px}
.dr-b{padding:2px 18px 18px;display:flex;flex-direction:column;flex:1}
.q{display:grid;grid-template-columns:84px minmax(0,1fr);gap:7px 12px;padding:11px 0;border-bottom:1px solid var(--line)}
.q>.ql{font-weight:700;font-size:16px;padding-top:6px}
.q>.ql small{display:block;font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
.q .fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;min-width:0}
.q .fields .full{grid-column:1/-1}
.radios{display:flex;flex-wrap:wrap;gap:4px}
.radios label{position:relative}
.radios input{position:absolute;opacity:0;inset:0}
.radios span{display:inline-block;padding:3px 9px;border-radius:999px;border:1px solid var(--line-strong);font-size:13px;cursor:pointer}
.radios input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.radios input:focus-visible+span{outline:2px solid var(--edit-ink);outline-offset:2px}
.hint{font-size:12.5px;color:var(--warn-ink);background:var(--warn);padding:4px 9px;border-radius:6px;margin-top:3px}
.dr-f{position:sticky;bottom:0;background:var(--panel);display:flex;gap:8px;justify-content:flex-end;padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.gate{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.gate form{width:min(400px,100%);display:flex;flex-direction:column;gap:14px}
.gate h1{margin:0;font-size:34px;line-height:1}
.gate .code{font:600 26px var(--mono);letter-spacing:.3em;text-transform:uppercase;height:52px!important;text-align:center}
.gate .err{color:var(--bad-ink);font-size:14px;min-height:18px;margin:0}

/* ---------- écrans plus étroits ---------- */

/* ===== Style fiche technique (réf. wiredin.design) : angles droits, filets, capitales à chasse fixe ===== */
*,*::before,*::after{border-radius:0!important}
.t,.t-add,.me,.av,.legend i,.sync::before{border-radius:999px!important}
:root{--line:#d6d4cc;--line-strong:#a9a69b;--muted:#55544e}

body{font-size:15px}

.search input{border-color:var(--ink);font-family:var(--mono);font-size:13px}
.side{background:var(--bg);border-right:1px solid var(--ink)}
.brand b{font-family:var(--mono);font-size:15px;letter-spacing:.06em;text-transform:uppercase}

.nav-b.main{font-size:13px;padding:12px 10px;border:1px solid var(--ink);margin-bottom:14px}
.nav-b .n{font-size:11px}
.top{border-bottom:1px solid var(--ink)}
.bigdate .d{font-family:var(--ui);font-weight:700}
.head{padding:8px 14px 8px;border-bottom:1px solid var(--ink)}
.hb{border-color:var(--line-strong);background:var(--panel)}
.chip{font-size:13px}
.s-t{font-size:13px}
.s-name{font-size:13.5px}
.foot{border-top:1px solid var(--ink)}
.ft{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.ft b{font-size:16px;letter-spacing:0}
.ft.big b{font-size:20px}
/* lignes serrées, une cellule par colonne, filets verticaux */
.list{padding:0 14px 8px}
.cols{--c:54px minmax(110px,1.15fr) minmax(110px,1.2fr) minmax(104px,1.05fr) minmax(80px,.75fr) minmax(140px,1.6fr) 74px minmax(110px,1.2fr) 32px}

.dcat.done{color:var(--muted);margin-top:26px}.dcat.done b{background:var(--line-strong);color:var(--ink)}
.dl.bad{border-left-color:#E10600}
.dl>span:nth-child(2){min-width:0}.dl>span:nth-child(2) .chip{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block}

.chat-b.has{animation:chatpulse 1.6s ease-in-out 3}
@keyframes chatpulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--orange) 35%,transparent)}}

}

<script>
/* =====================================================================
   Planning La Bocca — démo
   ===================================================================== */
const LS_DATA='planning-bocca-local-v1', LS_PREF='planning-bocca-prefs-v1';
function lsGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
function stable(v){if(Array.isArray(v))return '['+v.map(stable).join(',')+']';if(v&&typeof v==='object')return '{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+stable(v[k])).join(',')+'}';return JSON.stringify(v===undefined?null:v)}
const fmt=n=>{const r=Math.round(n*10)/10;return String(r).replace('.',',')};
const num=s=>parseFloat(String(s).replace(',','.'));

/* ---------- référentiels ---------- */
const CENTRALE='La Bocca';
const PLAQUES=[{c:'7656',p:''},{c:'V955',p:''},{c:'EF',p:'EF-507-VT'},{c:'EE',p:'EE-443-NL'},{c:'GW',p:'GW-741-DT'},{c:'V874',p:''}];
const plDisp=p=>(p&&p.p&&!/^n°\s*de\s*parc/i.test(p.p))?p.p:(p?p.c:'');
const EXT0=[{c:'FK218',p:'FK-218-QM · SP4 loueur'},{c:'HD470',p:'HD-470-LS · SP4 loueur'}];
const AG0=['Grasse','Nice','Vallauris','Tourrettes'];
const FOURN=['Lafarge','Fica','BST','GCA'];
const TAILLES=['17','20','24','26','28','32','36','42','47','52','BQA'];
const OUVRAGES=['Dalle','Dallage','Radier','Fondations','Voile','Poteaux-poutres','Escalier','Chape','Désactivé','Balayé','Piscine','Voirie','Gros béton','Propreté','Autre'];
const P_COMMENT=['Prendre 1 journée','Appeler avant départ','Appeler chaque camion','Attendre le client','Citybag 1er camion','Bétobag 1er camion','1er camion ferme pour escalier','Formule … en premier','Chef de chantier : ','Retard 1 h','Vidange longue 45 min+','Prévoir 1 h 30 par rotation','Accès difficile'];
const P_ENTRETIEN=['Graissage malaxeur','Graissage ensilage','Graissage tapis peseur','Nettoyage déchargeur','Nettoyage chargeur','Chargeur fosse','Chaussette ciment','Trappe à ciment','Trappe malaxeur','Piquage trappe malaxeur','Piquage pales malaxeur','Kärcher malaxeur','Rangement local stock','État stocks colorants','Enlèvement bennes : 1x Benne','Enlèvement bennes : 2x Bennes'];
const ZONES=['La piste','Le labo','Le stock','Local adjuvants','Zone ensilage intérieur','Organes de pesée'];
const SEMI_MAX=12;  // tours par semi et par jour à La Bocca
const AGG=['6/16','4/10','10/20','0/4L','0/4R','0/2'];
const CARRS=['CALLAS','GOURDON'];
const CIMENTS=['42,5R','52,5N','FILLER','SRPM'];
const ROLES={centraliste:'Centraliste',commercial:'Commercial',labo:'Tech labo'};
const DEM_TYPES={modif:'Modification de commande',formule:'Formule',compo:'Modification de composition',resultats:'Résultats d\'essais',eprouvettes:'Éprouvettes',info:'Info client',chantier:'Création chantier',contrat:'Formule au contrat',visite:'Visite de chantier',autre:'Autre'};
const POUR={centraliste:'Centraliste',commercial:'Commercial',labo:'Labo'};
const role=()=>prefs.user?prefs.user.role:'centraliste';
const peutValider=()=>role()==='centraliste'||role()==='commercial';  // valider, réserver pompes et camions, paiements
const isPhone=()=>typeof window!=='undefined'&&window.matchMedia&&window.matchMedia('(max-width:760px)').matches;
const simple=()=>role()!=='centraliste'||isPhone();
const STATUTS={attente:'En attente',encours:'En cours',terminee:'Terminée',annulee:'Annulée'};

/* ---------- dates ---------- */
const MOIS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const MOISL=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const JOURS=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const JC=['Dim.','Lun.','Mar.','Mer.','Jeu.','Ven.','Sam.'];
const pad=n=>String(n).padStart(2,'0');
const D=iso=>new Date(iso+'T12:00:00Z');
const toIso=d=>d.toISOString().slice(0,10);
const addDays=(iso,n)=>{const d=D(iso);d.setUTCDate(d.getUTCDate()+n);return toIso(d)};
const dow=iso=>D(iso).getUTCDay();
const isWE=iso=>{const w=dow(iso);return w===0||w===6};
const mondayOf=iso=>addDays(iso,-((dow(iso)+6)%7));
function isoWeek(iso){const d=D(iso);d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7)+3);const y=d.getUTCFullYear();const f=new Date(Date.UTC(y,0,4,12));return 1+Math.round(((d-f)/864e5-3+((f.getUTCDay()+6)%7))/7)}
const weekKey=iso=>{const d=D(mondayOf(iso));d.setUTCDate(d.getUTCDate()+3);return d.getUTCFullYear()+'-S'+pad(isoWeek(iso))};
const dayLong=iso=>{const d=D(iso);return `${JOURS[d.getUTCDay()]} ${d.getUTCDate()} ${MOIS[d.getUTCMonth()]} ${d.getUTCFullYear()}`};
const dayShort=iso=>{const d=D(iso);return `${JC[d.getUTCDay()]} ${d.getUTCDate()} ${MOIS[d.getUTCMonth()]}`};
function realToday(){const n=new Date();return `${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}`}
const hm=h=>h?h.replace(':',' h '):'';
function parseDate(s){
  s=s.trim().toLowerCase();let m=/^(\d{1,2})[\/.\- ](\d{1,2})(?:[\/.\- ](\d{2,4}))?$/.exec(s);let d,mo,y;

function closedWin(iso){const et=(dayRO(iso)||{}).etat;if(!et||et.k==='ouverte')return null;const p=et.per||'journee';

  return {de:w[0],a:w[1],lbl:w[2],k:et.k,t:et.t||''}}

  const sub=list=>{const l=list.filter(o=>statut(o)!=='annulee');const m=l.reduce((a,o)=>a+total(o),0),n=l.reduce((a,o)=>a+TR(o).length,0);return `${fmt(m)} m³ · ${n} tour${n>1?'s':''}`};
  const nowM=iso===TODAY?(new Date().getHours()*60+new Date().getMinutes()):-1;
  const cw=closedWin(iso);
  const rows=(list,from,to)=>{let zi=0,h='',placed=nowM<from||nowM>=to;list.forEach(o=>{if(!placed&&mins(o.h)>nowM){h+=nowLine();placed=true}let r=rowHTML(o,editors);if(inWin(o.h,cw))r=r.replace('class="row ','class="row closed ');if(zi++%2)r=r.replace('class="row ','class="row alt ');h+=r});if(!placed)h+=nowLine();return h};

function weekHTML(){

  const by={};ds.forEach(d=>ordersOn(d).forEach(o=>{if(statut(o)==='annulee'||o.kind==='pour')return;(by[o.ch]=by[o.ch]||[]).push(o)}));
  const series=Object.keys(by).map(k=>{const l=by[k];return {l,dset:[...new Set(l.map(o=>o.date))].sort()}}).filter(s=>s.dset.length>1);
  let h=`<div class="wk-scroll"><div class="wk" style="grid-template-columns:repeat(${ds.length},minmax(160px,1fr))">`;
  ds.forEach((d,i)=>{const t=totals(d);h+=`<button class="wk-h ${d===TODAY?'today':''} ${d===view.date?'sel':''}" style="grid-column:${i+1};grid-row:1" data-act="goto" data-d="${d}"><span class="wk-d">${JC[dow(d)]} ${D(d).getUTCDate()}</span><span class="wk-t">${fmt(t.m3)} m³ · ${t.n} tours</span></button>`});
  series.forEach((s,k)=>{const a=idx[s.dset[0]],b=idx[s.dset[s.dset.length-1]];const m=s.l.reduce((x,o)=>x+total(o),0);
    h+=`<button class="wk-bar" style="grid-column:${a+1}/${b+2};grid-row:${k+2}" data-act="goto" data-d="${s.dset[0]}" title="Chantier sur ${s.dset.length} jours"><b>${esc(siteName(s.l[0]))}</b> ${esc(cl(s.l[0].cl).n)} · ${s.dset.length} jours · ${fmt(m)} m³</button>`});
  const r=series.length+2;
  ds.forEach((d,i)=>{const os=ordersOn(d).filter(o=>statut(o)!=='annulee');const am=os.filter(o=>mins(o.h)<720),pm=os.filter(o=>mins(o.h)>=720);
    const cw=closedWin(d);h+=`<div class="wk-col ${cw?'closed':''}" style="grid-column:${i+1};grid-row:${r}">${cw?`<span class="wk-closed">${esc(winTxt(cw))}</span>`:''}${os.length?`${am.length?'<span class="wk-half">Matin</span>'+am.map(cardHTML).join(''):''}${pm.length?'<span class="wk-half">Après-midi</span>'+pm.map(cardHTML).join(''):''}`:'<p class="empty">Rien de prévu</p>'}</div>`});

  {go(f){const a=f.querySelector('#tp-1').value,b=per?f.querySelector('#tp-2').value:a;if(!/^\d{4}-\d{2}$/.test(a)||!/^\d{4}-\d{2}$/.test(b)||b<a){toast('Choisissez des mois dans l\'ordre');return 'keep'}const fm=f.querySelector('input[name="tp-s"]:checked').value;savePDF(`tours-camions-la-bocca-${a}${b!==a?'_'+b:''}-${fm}.pdf`,()=>toursPDF(a,b,fm))}});
  const upd=()=>{const a=popEl.querySelector('#tp-1').value,b=per?popEl.querySelector('#tp-2').value:a;if(/^\d{4}-\d{2}$/.test(a)&&/^\d{4}-\d{2}$/.test(b))popEl.querySelector('#tp-res').innerHTML=b<a?'<p class="muted">Le mois de fin doit suivre le mois de début.</p>':res(a,b)};
  popEl.querySelectorAll('input[type=month]').forEach(x=>x.addEventListener('input',upd));
}

function adjHTML(){
  const wk=weekKey(view.date);
  const keys=[[weekKey(addDays(view.date,-7)),'Semaine passée'],[wk,'Semaine en cours'],[weekKey(addDays(view.date,7)),'Semaine à venir']];
  const panel=([k,l])=>{const x=S.adjuvants[k]||[];return `<div class="panel ${k===wk?'cur':''}" data-wk="${k}"><h3>Semaine ${esc(k.split('-S')[1])}<small>${l}</small></h3>
    ${x.map((a,i)=>`<div class="adj-line ${a.on?'on':''}"><input type="checkbox" id="adj-${k}-${i}" data-act="adj-on" data-i="${i}" ${a.on?'checked':''} aria-label="Commandé"><span>${esc(a.t)}</span><button class="chip" data-act="adj-x" data-i="${i}" aria-label="Retirer">×</button></div>`).join('')||'<span class="muted">Rien pour cette semaine</span>'}
    <form class="inline-f" data-form="adj"><input id="adjin-${k}" placeholder="1000 L Adjuvant 1" aria-label="Nouvelle ligne"><button class="btn sm">Ajouter</button></form></div>`};
  let year='';
  if(view.adjYear){const y=D(view.date).getUTCFullYear();let d=mondayOf(y+'-01-04');const rows=[];for(let i=0;i<53;i++){const k=weekKey(d);if(!k.startsWith(String(y)))break;rows.push(k);d=addDays(d,7)}
    year=`<div class="tbl-wrap" style="margin-top:10px"><table class="year"><tbody>${rows.map(k=>`<tr class="${k===wk?'cur':''}"><td>S${esc(k.split('-S')[1])}</td><td>${(S.adjuvants[k]||[]).map(a=>esc(a.t)+(a.on?' ✓':'')).join(' · ')||'<span class="muted">—</span>'}</td></tr>`).join('')}</tbody></table></div>`}
  return `<div class="sec-h"><h2>Commande d'adjuvants</h2><p>Comme le tableau Velléda, semaine par semaine. Cochée = commandée.</p><button class="btn sm" data-act="adj-year">${view.adjYear?'Masquer le tableau de l\'année':'Tableau de l\'année'}</button></div>
  <div class="grid3">${keys.map(panel).join('')}</div>${year}`;
}

/* ===================== Chat de la centrale =====================
   Tous les connectés écrivent ; une fiche par message (pas de conflit à plusieurs).
   Conservation : 7 jours glissants (un fil d'exploitation, pas une archive) ;
   les messages plus anciens s'effacent d'eux-mêmes. Les réponses aux demandes restent aussi sur la demande. */
const CHAT_DAYS=7;
let chatWin=null;
function demoChat(){const n=Date.now(),h=36e5;return [
  {id:'m1',ts:n-26*h,by:'Julie (commercial)',role:'commercial',t:'Le chantier Villa Les Pins peut glisser à jeudi si la pompe n\'est pas dispo.'},
  {id:'m2',ts:n-25.5*h,by:'Karim',role:'centraliste',t:'Pompe Fica réservée pour mercredi, je te garde le créneau de 14 h.'},
  {id:'m3',ts:n-3*h,by:'Nadia (labo)',role:'labo',t:'Éprouvettes à prélever sur le 2e camion de BATISUD demain.'},
  {id:'m4',ts:n-2.6*h,by:'Sébastien',role:'centraliste',t:'Noté sur la ligne.',ref:{t:'Éprouvettes BATISUD'}}]}
const chatList=()=>{const lim=Date.now()-CHAT_DAYS*864e5;return (S.chat||[]).filter(m=>m.ts>=lim).sort((a,b)=>a.ts-b.ts)};
function chatPurge(){const lim=Date.now()-CHAT_DAYS*864e5;const n=(S.chat||[]).length;S.chat=(S.chat||[]).filter(m=>m.ts>=lim);return S.chat.length!==n}
function chatSend(t,ref){t=String(t||'').trim();if(!t)return false;S.chat=S.chat||[];S.chat.push({id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),ts:Date.now(),by:author(),role:role(),t:t.slice(0,1000),ref:ref||null});chatPurge();prefs.chatSeen=Date.now();savePrefs();commit();return true}
function chatUnread(){const me=author();return chatList().filter(m=>m.ts>(prefs.chatSeen||0)&&m.by!==me).length}
const chatOn=()=>!!(chatWin&&!chatWin.hidden);
function chatNav(){if(isPhone()&&S)renderChrome()}
function chatToggle(){if(chatWin&&!chatWin.hidden){chatWin.hidden=true;chatNav();return}chatOpen();chatNav()}
function chatOpen(){
  if(!chatWin){chatWin=document.createElement('div');chatWin.className='chatwin';chatWin.setAttribute('role','dialog');chatWin.setAttribute('aria-label','Chat de la centrale');
    chatWin.innerHTML=`<div class="cw-h"><div><b>Chat · La Bocca</b><span class="cw-who"></span></div><button class="cw-x" aria-label="Fermer le chat" title="Fermer">×</button></div><div class="cw-l" aria-live="polite"></div>
      <form class="cw-f"><textarea rows="2" placeholder="Écrire un message… (Entrée pour envoyer)" aria-label="Message" maxlength="1000"></textarea><button class="btn primary" type="submit">Envoyer</button></form>
      <p class="cw-note">Messages gardés 7 jours, visibles par toutes les personnes connectées au planning.</p>`;
    document.body.appendChild(chatWin);
    chatWin.querySelector('.cw-x').onclick=()=>{chatWin.hidden=true;chatNav()};
    const f=chatWin.querySelector('.cw-f'),ta=f.querySelector('textarea');
    f.addEventListener('submit',e=>{e.preventDefault();if(chatSend(ta.value)){ta.value='';render()}ta.focus()});
    ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();f.requestSubmit()}if(e.key==='Escape'){chatWin.hidden=true;chatNav()}});
  }
  chatWin.hidden=false;if(chatPurge())commit();chatRender(true);prefs.chatSeen=Date.now();savePrefs();
  const fb=document.querySelector('.chat-b');if(fb){fb.classList.remove('has');const b=fb.querySelector('b');if(b)b.remove()}
  if(!isPhone())setTimeout(()=>chatWin.querySelector('textarea').focus(),30);
}
function chatRender(force){if(!chatWin||chatWin.hidden)return;const box=chatWin.querySelector('.cw-l');const atEnd=force||box.scrollTop+box.clientHeight>=box.scrollHeight-40;
  const me=author();let last='';const L=chatList();
  box.innerHTML=L.length?L.map(m=>{const d=new Date(m.ts);const iso=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const sep=iso!==last?`<div class="cw-d">${esc(iso===TODAY?'Aujourd\'hui':dayShort(iso))}</div>`:'';last=iso;
    return `${sep}<div class="cw-m ${m.by===me?'mine':''} r-${esc(m.role||'')}"><div class="cw-a"><b>${esc(m.by)}</b><span>${pad(d.getHours())}:${pad(d.getMinutes())}</span></div>${m.ref?`<div class="cw-ref">↳ Réponse à « ${esc(m.ref.t)} »</div>`:''}<div class="cw-t">${esc(m.t)}</div></div>`}).join(''):'<p class="cw-empty">Aucun message ces 7 derniers jours. Écrivez le premier.</p>';
  if(atEnd)box.scrollTop=box.scrollHeight;
  const ps=(typeof peers!=='undefined'?peers:[]).filter(p=>p.kind==='viewer'&&p.presence&&p.presence.nom);const names=[...new Set(ps.map(p=>p.presence.nom))];
  chatWin.querySelector('.cw-who').textContent=names.length?' · en ligne : '+names.join(', '):MODE==='local'?' · démo sur cet appareil':'';

/* Double sécurité : petite fenêtre de confirmation. anchor=null remplace la fenêtre déjà ouverte. */
function confirmPop(anchor,title,detail,okLabel,fn,danger){
  const html=`<div class="pop-h">${esc(title)}</div>${detail?`<p class="muted" style="margin:0">${esc(detail)}</p>`:''}<div class="pop-cf"><button class="btn ${danger?'danger':'primary'}" data-pa="cfok">${esc(okLabel)}</button><button class="btn" data-pa="cfno">Annuler</button></div>`;
  const h={cfok(){return fn()},cfno(){return 'close'}};
  if(anchor===null&&!popEl.hidden){popH=h;popEl.innerHTML=html;placePop();setTimeout(()=>{const b=popEl.querySelector('[data-pa=cfok]');if(b)b.focus()},20);return 'keep'}
  openPop(anchor,html,h);setTimeout(()=>{const b=popEl.querySelector('[data-pa=cfok]');if(b)b.focus()},20);return 'keep';
}
const ordLbl=o=>`${cl(o.cl).n} · ${siteName(o)} · ${dayShort(o.date)}`;

function fieldHTML(f,i){const id='pf'+i;
  if(f.type==='select')return `<label class="fl">${esc(f.label)}<select id="${id}">${f.opts.map(o=>{const v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;return `<option value="${esc(v)}" ${String(f.val)===String(v)?'selected':''}>${esc(l)}</option>`}).join('')}</select></label>`;
  if(f.type==='check')return `<label class="ck"><input type="checkbox" id="${id}" ${f.val?'checked':''}> ${esc(f.label)}</label>`;
  const dl=f.list?`<datalist id="${id}-dl">${f.list.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`:'';
  return `<label class="fl">${esc(f.label)}<input id="${id}" type="${f.type||'text'}" ${f.step?`step="${f.step}"`:''} value="${esc(f.val==null?'':f.val)}" ${f.list?`list="${id}-dl"`:''} ${f.ph?`placeholder="${esc(f.ph)}"`:''} autocomplete="off">${dl}</label>`;
}
function formPop(anchor,title,fields,onSave,extra){

    Object.assign({save(form){const v={};fields.forEach((f,i)=>{const el=form.querySelector('#pf'+i);v[f.k]=f.type==='check'?el.checked:el.value.trim()});return onSave(v)}},popH.__extra||{}));

/* ---------- mini-calendrier (duplication, placement) ---------- */
function calHTML(month,title){const m=D(month+'-01');const y=m.getUTCFullYear(),mo=m.getUTCMonth();const first=month+'-01';const off=(dow(first)+6)%7;const nd=new Date(Date.UTC(y,mo+1,0)).getUTCDate();
  let g='';['L','M','M','J','V','S','D'].forEach(x=>g+=`<span class="wd">${x}</span>`);for(let i=0;i<off;i++)g+='<span></span>';
  for(let d=1;d<=nd;d++){const iso=`${y}-${pad(mo+1)}-${pad(d)}`;g+=`<button data-pa="pickday" data-d="${iso}" class="${iso===TODAY?'td':''} ${isWE(iso)?'we':''} ${hasOrders(iso)?'has':''}" aria-label="${esc(dayLong(iso))}">${d}</button>`}
  return `<div class="pop-h">${esc(title)}</div><div class="cal-h"><button class="ib" data-pa="calprev" aria-label="Mois précédent">‹</button><b>${MOISL[mo]} ${y}</b><button class="ib" data-pa="calnext" aria-label="Mois suivant">›</button></div><div class="cal">${g}</div>`}
function calPop(anchor,title,onPick,startMonth){let month=startMonth||TODAY.slice(0,7);
  const h={pickday(el){return onPick(el.dataset.d)},calprev(){const d=D(month+'-01');d.setUTCMonth(d.getUTCMonth()-1);month=toIso(d).slice(0,7);popEl.innerHTML=calHTML(month,title);return 'keep'},calnext(){const d=D(month+'-01');d.setUTCMonth(d.getUTCMonth()+1);month=toIso(d).slice(0,7);popEl.innerHTML=calHTML(month,title);return 'keep'}};
  openPop(anchor,calHTML(month,title),h)}

function go(d){view.date=d;render(true);window.scrollTo({top:0})}
function jlog(d,t){const dd=day(d);const n=new Date();dd.journal=dd.journal||[];dd.journal.push({at:`${pad(n.getHours())}:${pad(n.getMinutes())}`,by:author(),t})}
function unmove(id,i){const x=byId(id).tours[i];if(!x)return;
  if(x.mv){const d=byId(x.mv);if(d){const k=d.tours.findIndex(u=>u.rf===id&&(u.p||'')===(x.p||''));if(k>=0){const u=d.tours[k];if(u.free){u.s=0;delete u.p;delete u.rf;delete u.free;delete u.plein;if(u.fv!=null){u.v=u.fv;delete u.fv}}else d.tours.splice(k,1)}}}
  if(x.rf){const s0=byId(x.rf);if(s0){const u=s0.tours.find(u=>u.mv===id&&(u.p||'')===(x.p||''));if(u)delete u.mv}}}
function tourPop(o,i,anchor){const id=o.id;const t=o.tours[i];const fl=FLEET().concat(onSite(o));
  setEditing(id);
  const html=`<div class="pop-h">Tour ${i+1} · ${fmt(t.v)} m³</div>
  <button class="pop-b ${t.s?'':'on'}" data-pa="toggle">${t.s?'Retirer le stabilo (pas chargé)':'Stabiloter : chargé'}</button>
  ${t.mv?`<p class="muted" style="margin:0">Replacé vers <b>${esc(byId(t.mv)?siteName(byId(t.mv)):'?')}</b>, compté là-bas.</p><button class="pop-b" data-pa="unmv">Annuler le replacement</button>`:''}${t.rf?`<p class="muted" style="margin:0">Camion venu de <b>${esc(byId(t.rf)?siteName(byId(t.rf)):'?')}</b> (déjà chargé).</p>`:''}${t.s&&!t.mv&&!t.rf?'<button class="pop-b" data-pa="move" style="color:#2f6fd6">Replacer sur un autre chantier…</button>':''}
  <div class="pop-l">Plaque</div><div class="pop-grid">${fl.map(p=>{const ab=absentOn(o.date,p.c),x=convOf(o.date,p.c);return `<button class="pop-c ${t.p===p.c?'on':''} ${ab?'off':''}" data-pa="plaque" data-v="${esc(p.c)}" title="${esc(p.p||'')}${ab?' · absent ce jour':x&&x.st==='pret'?' · prêté à '+esc(x.pc)+' ('+esc(x.per)+')':''}">${esc(p.c)}</button>`}).join('')}<button class="pop-c" data-pa="plaque" data-v="">—</button></div>
  <form data-pa="typed" class="pk-f"><input id="pk-t" placeholder="Autre plaque (ex. EF507VT)" aria-label="Autre plaque" autocomplete="off"><button class="btn" type="submit">OK</button></form>
  <div class="pop-l">Chargé par une autre centrale</div><div class="pop-grid">${AG().map(c=>`<button class="pop-c txt ${t.c===c?'on':''}" data-pa="ext" data-v="${c}">${c}</button>`).join('')}${t.c?'<button class="pop-c txt" data-pa="ext" data-v="">Aucune</button>':''}</div>
  <form data-pa="vol"><label class="fl">Volume du tour (m³)<input id="pv" type="number" step="0.5" min="0.5" max="${capOf(o.cam)}" value="${t.v}"></label><button class="btn" type="submit">Changer le volume</button></form>
  <button class="pop-b danger" data-pa="del">Supprimer ce tour</button>`;
  const T=()=>byId(id).tours[i];
  openPop(anchor,html,{typed(f){const v=f.querySelector('#pk-t').value;if(!plN(v))return 'keep';const c=plateOf(v,byId(id));return early(o,null,()=>{const x=T();x.p=c;x.s=1})},toggle(){const x=T();if(!x.s)return early(o,null,()=>{T().s=1});return confirmPop(null,'Retirer le stabilo ?',`Tour ${i+1}${x.p?' · '+x.p:''} · ${fmt(x.v)} m³ est noté chargé.`,'Oui, pas chargé',()=>{T().s=0},true)},plaque(el){const c=el.dataset.v;if(!c||T().s){const x=T();x.p=c;if(c)x.s=1;return}return early(o,null,()=>{const x=T();x.p=c;x.s=1})},ext(el){const c=el.dataset.v;const x=T();if(!c){delete x.c;x.s=0;return}x.c=c;x.s=1},vol(f){const v=num(f.querySelector('#pv').value);if(v>0)T().v=v},del(){return confirmPop(null,'Supprimer ce tour ?',`Tour ${i+1} · ${fmt(T().v)} m³`,'Oui, supprimer',()=>{unmove(id,i);byId(id).tours.splice(i,1)},true)},
    move(){const os=ordersOn(byId(id).date).filter(x=>x.id!==id&&statut(x)!=='annulee'&&x.kind!=='pour'&&x.kind!=='demande');
      if(!os.length){toast('Aucun autre chantier ce jour');return 'keep'}
      popEl.innerHTML=`<div class="pop-h">Replacer ${esc(T().p||'le camion')} · ${fmt(T().v)} m³</div><p class="muted" style="margin:0;font-size:12.5px">Vers quel chantier ?</p><div class="pop-list">${os.map(x=>`<button class="pop-b" data-pa="mvto" data-v="${x.id}"><b>${esc(x.h)}</b> ${esc(cl(x.cl).n)} · ${esc(siteName(x))}</button>`).join('')}</div><label class="ck"><input type="checkbox" id="mv-re" checked> Prévoir un nouveau tour pour ${esc(siteName(byId(id)))}</label><button class="btn" data-pa="cfno">Annuler</button>`;
      placePop();return 'keep'},
    cfno(){return 'close'},
    mvto(el){const dId=el.dataset.v,dst=byId(dId);if(!dst)return 'close';const re=popEl.querySelector('#mv-re').checked;const x0=T();
      const k=dst.tours.findIndex(u=>!u.s&&!u.c&&!u.mv&&!u.rf&&!u.p);
      popEl.innerHTML=`<div class="pop-h">${esc(x0.p||'Camion')} → ${esc(siteName(dst))}</div>
        <p class="muted" style="margin:0;font-size:12.5px">${k>=0?`Il prendra le tour ${k+1}, première bulle libre.`:'Aucune bulle libre : une bulle sera créée.'}</p>
        <form data-pa="mvgo" class="mv-f"><label class="fl">m³ replacés<input id="mv-v" type="number" step="0.5" min="0.5" max="${capOf(dst.cam)||12}" value="${x0.v}" required></label>
        <label class="ck"><input type="checkbox" id="mv-full"> Toupie rechargée pleine à la centrale</label>
        <div class="pop-cf"><button class="btn primary" type="submit">Valider</button><button class="btn" type="button" data-pa="cfno">Annuler</button></div></form>`;
      popEl.dataset.mv=JSON.stringify({dId,re,k});placePop();setTimeout(()=>{const n=popEl.querySelector('#mv-v');if(n){n.focus();n.select()}},20);return 'keep'},
    mvgo(f){const {dId,re,k}=JSON.parse(popEl.dataset.mv||'{}');const v=num(f.querySelector('#mv-v').value);const full=f.querySelector('#mv-full').checked;if(!(v>0)){toast('Indiquez les m³ replacés');return 'keep'}
      const o0=byId(id),x=T(),d=byId(dId);if(!d)return 'close';x.mv=dId;
      const nt={s:1,p:x.p||'',rf:id,v};if(full)nt.plein=1;
      if(k<0)d.tours.push(Object.assign(nt,{x:1}));else{const u=d.tours[k];u.fv=u.v;Object.assign(u,nt,{free:1})}
      if(re)o0.tours.push({v:x.v,s:0,x:1});
      jlog(o0.date,`Camion ${x.p||''} chargé replacé : ${siteName(o0)} → ${siteName(d)} · ${fmt(v)} m³${full?' · rechargé plein':''}${k<0?' · bulle créée':''}`);
      toast(`Camion replacé sur ${siteName(d)} · ${fmt(v)} m³${full?' · plein':''}`)},
    unmv(){const x=T();unmove(id,i);delete x.mv;toast('Replacement annulé')}});
}

function act(a,el,o,e){
  const D_=view.date;const i=+el.dataset.i;
  switch(a){
    case 'prev':return go(view.mode==='semaine'&&view.tab==='planning'?addDays(mondayOf(view.date),-7):step(view.date,-1));
    case 'next':return go(view.mode==='semaine'&&view.tab==='planning'?addDays(mondayOf(view.date),7):step(view.date,1));
    case 'today':{TODAY=realToday();view.tab='planning';view.mode='jour';if(isPhone()&&chatOn())chatWin.hidden=true;let d=TODAY;while(isWE(d)&&!hasOrders(d))d=addDays(d,1);return go(d)}
    case 'mode':view.mode=el.dataset.v;view.tab='planning';return render(true);
    case 'tab':if(isPhone()&&chatOn())chatWin.hidden=true;if(el.dataset.v==='planning'&&role()==='centraliste'){TODAY=realToday();view.mode='jour';if(view.tab==='planning'||view.date!==TODAY){view.tab='planning';return go(TODAY)}}view.tab=el.dataset.v;return render(true);
    case 'goto':view.date=el.dataset.d;view.mode='jour';view.tab='planning';document.getElementById('qres').hidden=true;return render(true);
    case 'focus':{e.preventDefault();document.getElementById('qres').hidden=true;const x=byId(el.dataset.oid);if(!x)return;view.tab='planning';view.mode='jour';view.date=x.date;view.focus=x.id;return render(true)}
    case 'new':return openOrderForm(null);
    case 'pickdate':return calPop(el,'Aller au planning du…',d=>{view.tab='planning';view.mode='jour';go(d);return 'close'},view.date.slice(0,7));
    case 'vue':prefs.vue=el.dataset.v;savePrefs();lastAnim='';return render(true);
    case 'settings':return settingsPop(el);
    case 'reset':S=buildDemo();Object.keys(synced).forEach(p=>delete synced[p]);{const m=docsOf();Object.keys(m).forEach(p=>synced[p]=stable(m[p]))}lsSet(LS_DATA,S);return render(true);
    case 'banner-ok':{const n=new Date();prefs.banner=`${n.getFullYear()}-${n.getMonth()}`;savePrefs();return render(true)}
    // ligne commande
    case 'edit':return openOrderForm(o);
    case 'menu':return orderMenu(o,el);
    case 'tour':{const t=o.tours[i];if(t.mv)return tourPop(o,i,el);if(!t.s&&!t.p&&!t.c)return platePick(o,i,el);if(!t.s){if(o.date>TODAY){const id=o.id;setEditing(id);return early(o,el,()=>{byId(id).tours[i].s=1})}t.s=1;break}const id=o.id;setEditing(id);return confirmPop(el,'Retirer le stabilo ?',`Tour ${i+1}${t.p?' · '+t.p:''} · ${fmt(t.v)} m³ est noté chargé.`,'Oui, pas chargé',()=>{byId(id).tours[i].s=0},true)}
    case 'plus':{const id=o.id;setEditing(id);return openPop(el,`<div class="pop-h">Complément à confirmer</div><p class="muted" style="margin:0;font-size:13px">${esc(cl(o.cl).n)} · ${fmt(total(o))} m³ <b>et plus</b> : le client prendra sans doute 1 tour de plus, quantité à confirmer.</p><button class="pop-b on" data-pa="add">Complément confirmé : ajouter le tour…</button><button class="pop-b" data-pa="no">Pas de complément : retirer le [+]</button>`,
      {add(){const a=popAnchor;byId(id).plus=false;commit();jlog(byId(id).date,`Complément confirmé : ${siteName(byId(id))}`);setTimeout(()=>platePick(byId(id),null,document.querySelector(`#row-${id} .t-add`)||a));return 'close'},no(){byId(id).plus=false;toast('Complément retiré')}})}
    case 'addtour':return platePick(o,null,el);
    case 'pill':o.pills[i].on=!o.pills[i].on;break;
    case 'pill-x':{e.stopPropagation();const id=o.id;setEditing(id);return confirmPop(el,'Supprimer ce commentaire ?',o.pills[i].t,'Oui, supprimer',()=>{byId(id).pills.splice(i,1)},true)}
    case 'pills-all':return plShow(el);
    case 'pills-edit':{const id=o.id;return setTimeout(()=>pillsPop(plAnchor&&document.body.contains(plAnchor)?plAnchor:document.querySelector(`#row-${id} .r-menu`)||el,id))}
    case 'addpill':{const id=o.id;setEditing(id);return listPop(el,'Ajouter une info sur la ligne',P_COMMENT,v=>{byId(id).pills.push({t:v,on:false,by:author()})},'Ou texte libre (retard, consigne…)')}
    case 'formule':{const id=o.id;setEditing(id);return formPop(el,'Formule',[{k:'f',label:'Formule (comme sur le papier)',val:o.f,list:S.formules.map(x=>x.f)},{k:'sap',label:'N° SAP (8 chiffres, facultatif)',val:sapOf(o),ph:'60012481'}],v=>{if(v.sap&&!/^\d{8}$/.test(v.sap)){toast('Le SAP doit faire 8 chiffres');return 'keep'}const x=byId(id);x.f=v.f;x.sap=v.sap;learnFormule(v.f,v.sap)})}
    case 'pompe':{const id=o.id,b=o.pompe.bon;setEditing(id);return confirmPop(el,b?'Remettre le bon de pompe à faire ?':'Confirmer : bon de pompe fait ?',ordLbl(o),b?'Oui, pas encore fait':'Oui, le bon est fait',()=>{byId(id).pompe.bon=!b;toast(b?'Bon de pompe à faire':'Bon de pompe fait')},b)}
    case 'pay':{const id=o.id,p=o.pay.paye;setEditing(id);return confirmPop(el,p?'Remettre le paiement en attente ?':'Confirmer : paiement reçu ?',ordLbl(o),p?'Oui, pas encore payé':'Oui, le client a payé',()=>{byId(id).pay.paye=!p;toast(p?'Paiement en attente':'Paiement validé')},p)}

function saveOrderForm(f){

   const d0=g('f-d').value;if(bad&&bad.we){const x=day(d0);const n=new Date();x.ouvert={by:author(),at:`${pad(n.getHours())}:${pad(n.getMinutes())}`};jlog(d0,'Ouverture exceptionnelle du week-end (commande)')}}

  toast(o.kind==='aplacer'&&role()!=='centraliste'?'Commande envoyée au centraliste pour validation':'Commande enregistrée');
  render(true);
}

        async set(body){const {error}=await sb.from('documents').upsert({collection,id,data:body});if(error)throw supaErr(error);(cache[collection]||(cache[collection]=new Map())).set(id,body)},
        async delete(){const {error}=await sb.from('documents').delete().eq('collection',collection).eq('id',id);if(error)throw supaErr(error);if(cache[collection])cache[collection].delete(id)},
        async get(){const {data,error}=await sb.from('documents').select('data').eq('collection',collection).eq('id',id).maybeSingle();if(error)throw supaErr(error);return {exists:!!data,data:()=>data&&data.data}}
      };
    }
  };
}

// Présence : qui est connecté et qui modifie quelle ligne
function supaRoom(sb){
  const key=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Math.random()).slice(2);
  let state={},joined=false;const cbs=[];
  const ch=sb.channel('presence-planning',{config:{presence:{key}}});
  const peersNow=()=>{const out=[];Object.entries(ch.presenceState()).forEach(([k,arr])=>arr.forEach(pr=>{const {presence_ref,...p}=pr;out.push({kind:'viewer',presence:p,isMe:k===key,sameTab:k===key})}));return out};
  ch.on('presence',{event:'sync'},()=>{const ps=peersNow();cbs.forEach(cb=>{try{cb({peers:ps})}catch(e){}})})
    .subscribe(st=>{if(st==='SUBSCRIBED'){joined=true;ch.track(state).catch(()=>{})}});
  return {
    presence(p){state=Object.assign({},state,p);return joined?ch.track(state):Promise.resolve()},
    onPeers(cb){cbs.push(cb);cb({peers:peersNow()})}
  };
}

async function supaLogin(){
  try{await SB.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname,queryParams:{prompt:'select_account'}}})}
  catch(e){toast('Connexion Google impossible pour le moment')}
}
async function supaLogout(){try{await SB.auth.signOut()}catch(e){}prefs.user=null;prefs.gate='';savePrefs();try{localStorage.removeItem(LS_MIRROR);localStorage.removeItem(LS_PEND)}catch(e){}location.reload()}

// Remplace toutes les données partagées (import d'une sauvegarde ou démo)
function remplacerDonnees(d,label){
  if(!d||!Array.isArray(d.orders)){toast('Fichier non reconnu : ce n\'est pas une sauvegarde du planning');return}
  const keep=logLine;logLine=()=>{};
  try{
    S=clone(d);
    S.chat=S.chat||[];S.days=S.days||{};
    ['clients','chantiers','formules','demandes','plaquesX','liens'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});
    ['convocs','adjuvants'].forEach(k=>{if(!S[k]||typeof S[k]!=='object')S[k]={}});
    if(!S.config)S.config=CONFIG0();
    commit();
  }finally{logLine=keep}
  render(true);toast(label);
}
function importerSauvegarde(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{let o;try{o=JSON.parse(r.result)}catch(e){toast('Fichier illisible');return}
      const d=o&&o.donnees?o.donnees:o;
      if(!confirm('Remplacer TOUT le planning partagé par cette sauvegarde ?\n'+(d&&d.orders?d.orders.length:0)+' commandes. Les autres utilisateurs verront le changement tout de suite.'))return;
      remplacerDonnees(d,'Sauvegarde importée')};
    r.readAsText(f)};
  inp.click();
}
function chargerDemo(){
  if(!confirm('Remplacer TOUT le planning partagé par les données de démonstration (fictives) ?'))return;
  const d=buildDemo();if(!d.chat)d.chat=demoChat();remplacerDonnees(d,'Données de démo chargées');
}

async function supaBoot(){
  const main=document.getElementById('main');
  if(!window.supabase||!window.supabase.createClient){main.innerHTML='<p class="empty">La connexion sécurisée n\'a pas pu se charger. Vérifiez la connexion internet puis rechargez la page.</p>';return}
  SB=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}});
  let session=null;
  try{session=(await SB.auth.getSession()).data.session}catch(e){}
  if(!session){ME=null;main.innerHTML='<p class="empty">Connexion requise.</p>';showGate();return}
  let p=null;
  try{const r=await SB.rpc('mon_profil');p=r.data&&r.data[0]}catch(e){}
  ME={email:session.user.email,nom:p?p.nom:session.user.email,role:p?p.role:null,actif:!!(p&&p.actif)};
  SB.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')location.reload()});
  if(!ME.actif){prefs.user=null;savePrefs();main.innerHTML='<p class="empty">Accès non autorisé.</p>';showGate();return}
  if(prefs.user&&!isAdmin())prefs.user.role=ROLE_UI[ME.role]||'commercial';
  if(!prefs.user||prefs.gate!==TODAY||prefs.email!==ME.email)showGate();
  startShared(supaDb(SB));
  room=supaRoom(SB);
  if(prefs.user)room.presence({nom:prefs.user.nom,role:prefs.user.role,edit:null}).catch(()=>{});
  room.onPeers(ch=>{peers=ch.peers.slice();if(S){if(popEl.hidden&&drawerEl.hidden)render();else renderChrome()}});
  setTimeout(()=>loadPdf().catch(()=>{}),2500);
}


/* =====================================================================
   Infos sur la ligne : affichage limité, liste complète au survol, éditeur
   ===================================================================== */
const pillsLim=o=>{const n=(o.pills||[]).length;return isPhone()||n<=2?n:1};
function pillChip(p,i){return `<button class="chip ${p.on?'on':''}" data-act="pill" data-i="${i}" data-long="1" title="${esc(p.t)} · posé par ${esc(p.by||'?')} · clic : fait / à faire · double-clic : modifier"><span class="pt">${esc(p.t)}</span><span class="x" data-act="pill-x" data-i="${i}" role="button" aria-label="Retirer">×</span></button>`}
function pillsRow(o){
  const all=o.pills||[],lim=pillsLim(o);
  const more=all.length-lim;
  return all.slice(0,lim).map(pillChip).join('')
    +(more>0?`<button class="chip more" data-act="pills-all" title="Voir les ${all.length} infos">+${more}</button>`:'')
    +`<button class="chip add" data-act="addpill" aria-label="Ajouter une info">+ Info</button>`;
}
let plEl=null,plTimer=null,plHideT=null,plAnchor=null;
function plBuild(o){
  return `<div class="pl-h">${esc(cl(o.cl).n)} · ${o.pills.length} info${o.pills.length>1?'s':''}</div>
    <div class="pl-l">${o.pills.map(pillChip).join('')||'<p class="muted" style="margin:0">Aucune info</p>'}</div>
    <div class="pl-f"><button class="btn sm" data-act="addpill">+ Info</button><button class="btn sm" data-act="pills-edit">Modifier les infos</button></div>`;
}
function plShow(anchor){
  const row=anchor&&anchor.closest('[data-id]');const o=row&&byId(row.dataset.id);if(!o)return;
  plClose();plAnchor=anchor;
  plEl=document.createElement('div');plEl.id='plist';plEl.className='plist';plEl.dataset.id=o.id;plEl.innerHTML=plBuild(o);
  document.body.appendChild(plEl);
  const r=anchor.getBoundingClientRect(),w=plEl.offsetWidth,h=plEl.offsetHeight;
  let x=Math.min(r.left,innerWidth-w-8),y=r.bottom+2;if(y+h>innerHeight-8)y=Math.max(8,r.top-h-2);
  plEl.style.left=Math.max(8,x)+'px';plEl.style.top=y+'px';
  plEl.addEventListener('click',()=>setTimeout(plClose,0));
}
function plClose(){clearTimeout(plTimer);clearTimeout(plHideT);if(plEl){plEl.remove();plEl=null;plAnchor=null}}
function plRefresh(){if(!plEl)return;const o=byId(plEl.dataset.id);if(!o||!o.pills.length){plClose();return}plEl.innerHTML=plBuild(o)}
document.addEventListener('mouseover',e=>{
  const c=e.target.closest&&e.target.closest('.r-pills[data-more]');
  if(c){clearTimeout(plHideT);const id=c.closest('[data-id]').dataset.id;if(plEl&&plEl.dataset.id===id)return;clearTimeout(plTimer);plTimer=setTimeout(()=>plShow(c),450);return}
  if(e.target.closest&&e.target.closest('#plist')){clearTimeout(plHideT);return}
  clearTimeout(plTimer);if(plEl){clearTimeout(plHideT);plHideT=setTimeout(plClose,300)}
});
addEventListener('scroll',()=>plClose(),true);
// éditeur (menu ⋯ et formulaire de commande)
function peRow(t){return `<div class="pe-r"><input name="pt" value="${esc(t)}" placeholder="Info (retard, consigne…)" maxlength="80" autocomplete="off"><button type="button" class="pe-x" data-pe="x" aria-label="Retirer cette info" title="Retirer">×</button></div>`}
function pillsEditor(pills){
  return `<div class="pe">${(pills||[]).map(p=>peRow(p.t)).join('')}${peRow('')}</div>
    <div class="pe-pre">${P_COMMENT.slice(0,10).map(t=>`<button type="button" class="chip" data-pe="pre" data-v="${esc(t)}">+ ${esc(t)}</button>`).join('')}</div>
    <button type="button" class="btn sm" data-pe="add" style="align-self:flex-start">+ Ajouter une ligne</button>`;
}
function peValues(form){const out=[];form.querySelectorAll('.pe input[name="pt"]').forEach(x=>{const v=x.value.trim();if(v&&!out.includes(v))out.push(v)});return out}
function mergePills(old,vals){return vals.map((t,i)=>{const same=(old||[]).find(p=>p.t===t);if(same)return same;const prev=(old||[])[i];return {t,on:false,by:prev&&!vals.includes(prev.t)?prev.by:author()}})}
document.addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('[data-pe]');if(!b)return;
  e.preventDefault();e.stopPropagation();
  const box=b.closest('form').querySelector('.pe');const k=b.dataset.pe;
  if(k==='x'){const r=b.closest('.pe-r');if(box.children.length>1)r.remove();else r.querySelector('input').value='';return}
  if(k==='add'){box.insertAdjacentHTML('beforeend',peRow(''));box.lastElementChild.querySelector('input').focus();return}
  if(k==='pre'){const v=b.dataset.v;if([...box.querySelectorAll('input')].some(x=>x.value.trim()===v))return;const empty=[...box.querySelectorAll('input')].find(x=>!x.value.trim());if(empty)empty.value=v;else box.insertAdjacentHTML('beforeend',peRow(v));if(![...box.querySelectorAll('input')].some(x=>!x.value.trim()))box.insertAdjacentHTML('beforeend',peRow(''));}
},true);
function pillsPop(anchor,id){setEditing(id);
  openPop(anchor,`<div class="pop-h">Infos sur la ligne</div><form data-pa="psave" class="pe-form">${pillsEditor(byId(id).pills)}<button class="btn primary" type="submit">Enregistrer</button></form>`,
    {psave(f){const x=byId(id);x.pills=mergePills(x.pills,peValues(f));toast('Infos enregistrées')}});
}

/* =====================================================================
   Démarrage et événements
   ===================================================================== */
function boot(){
  applyTheme();
  document.getElementById('main').innerHTML='<p class="empty">Chargement du planning…</p>';
  supaBoot();
  if(false){
  let settled=false;
  const fallback=setTimeout(()=>{if(!settled){settled=true;startLocal()}},6000);
  const cl_=window.STANDALONE?null:window.claude;
  if(cl_&&cl_.use){
    cl_.use('db').then(db=>{if(settled)return;settled=true;clearTimeout(fallback);db?startShared(db):startLocal()}).catch(()=>{if(!settled){settled=true;clearTimeout(fallback);startLocal()}});
    cl_.use('downloads').then(d=>{DL=d}).catch(()=>{});
    setTimeout(()=>loadPdf().catch(()=>{}),2500);
    cl_.use('room').then(r=>{if(!r)return;room=r;if(prefs.user)r.presence({nom:prefs.user.nom,role:prefs.user.role,edit:null}).catch(()=>{});r.onPeers(ch=>{peers=ch.peers.slice();if(S){if(popEl.hidden&&drawerEl.hidden)render();else renderChrome()}},()=>{})}).catch(()=>{});
  }else{clearTimeout(fallback);settled=true;startLocal()}
  }

  document.addEventListener('click',e=>{
    if(suppressClick){suppressClick=false;e.preventDefault();e.stopPropagation();return}
    const pa=e.target.closest('[data-pa]');
    if(pa&&popEl.contains(pa)&&pa.tagName!=='FORM'){e.preventDefault();runPop(pa);return}
    if(!popEl.hidden&&!popEl.contains(e.target))closePop();
    if(popEl.contains(e.target))return;
    const qres=document.getElementById('qres');if(!qres.hidden&&!e.target.closest('.search'))qres.hidden=true;
    const cf=e.target.closest('[data-cfg]');if(cf){cfgAction(cf);return}
    const a=e.target.closest('[data-act]');if(!a)return;
    const ac=a.dataset.act;
    if(ac==='dr-close'||(ac==='dr-close-bg'&&e.target===a)){closeDrawer();return}
    if(ac==='dr-close-bg')return;
    if(a.tagName==='INPUT'&&a.type==='checkbox'&&ac!=='adj-on')return;
    const rowEl=a.closest('[data-id]');const o=rowEl?byId(rowEl.dataset.id):null;
    act(ac,a,o,e);
  });
  document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
    if(popEl.contains(f)){runPop(f);return}
    if(f.id==='oform')return saveOrderForm(f);
    if(f.id==='gateform')return gateSubmit(f);
    if(f.dataset.cfgform)return cfgSubmit(f);
    if(f.dataset.form==='adj'){const k=f.closest('[data-wk]').dataset.wk;const inp=f.querySelector('input');const v=inp.value.trim();if(!v)return;(S.adjuvants[k]=S.adjuvants[k]||[]).push({t:v,on:false});commit();render(true);setTimeout(()=>{const n=document.getElementById('adjin-'+k);if(n)n.focus()},0)}
  });
  // clic long / clic droit
  let lt=null;
  document.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-long]');if(!el||e.button>0)return;lt=setTimeout(()=>{lt=null;suppressClick=true;longAct(el)},480)});
  ['pointerup','pointercancel','pointerleave','scroll'].forEach(ev=>document.addEventListener(ev,()=>{if(lt){clearTimeout(lt);lt=null}},true));
  document.addEventListener('dblclick',e=>{const el=e.target.closest('[data-act="pill"]');if(!el)return;e.preventDefault();const row=el.closest('[data-id]');if(row){const o=byId(row.dataset.id),k=+el.dataset.i;if(o){const fresh=document.querySelector(`#row-${o.id} [data-act="pill"][data-i="${k}"]`)||el;pillEdit(o,k,fresh)}}});
  document.addEventListener('contextmenu',e=>{const el=e.target.closest('[data-long]');if(!el)return;e.preventDefault();if(lt){clearTimeout(lt);lt=null}longAct(el)});
  // recherche
  const q=document.getElementById('q'),qres=document.getElementById('qres');
  q.addEventListener('input',()=>{const s=q.value.trim().toLowerCase();if(s.length<2){qres.hidden=true;return}
    const dd=parseDate(s);const dateBtn=dd?`<button data-act="goto" data-d="${dd}"><span class="mono" style="font-size:12.5px">${esc(dayShort(dd))}</span><span><b>Ouvrir le planning du ${esc(dayLong(dd))}</b> · ${fmt(totals(dd).m3)} m³</span></button>`:'';
    const res=S.orders.filter(o=>{const c=cl(o.cl),ch=chan(o.ch);return (c.n+' '+(ch?ch.nom+' '+ch.adr:'')).toLowerCase().includes(s)}).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30);
    qres.innerHTML=dateBtn+(res.length?res.map(o=>`<button data-act="focus" data-oid="${o.id}"><span class="mono" style="font-size:12.5px">${esc(dayShort(o.date))}</span><span><b>${esc(cl(o.cl).n)}</b> · ${esc(siteName(o))} · ${fmt(total(o))} m³${o.kind==='aplacer'?' · à placer':''}</span></button>`).join(''):(dateBtn?'':'<p class="empty">Aucun résultat</p>'));qres.hidden=false});
  q.addEventListener('keydown',e=>{if(e.key==='Escape'){q.value='';qres.hidden=true;q.blur()}});
  // clavier
  document.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&!popEl.hidden&&e.target.tagName==='INPUT'&&popEl.contains(e.target)&&e.target.form){const fs=[...e.target.form.querySelectorAll('input:not([type=hidden]):not([type=checkbox]):not([type=radio]),select,textarea')];const k=fs.indexOf(e.target);if(k>=0&&k<fs.length-1){e.preventDefault();fs[k+1].focus();return}}
    if(e.key==='Escape'){if(!popEl.hidden)closePop();else if(!drawerEl.hidden)closeDrawer();return}
    const t=e.target;if(t.closest&&t.closest('input,textarea,select,[contenteditable]'))return;
    if(!drawerEl.hidden||!document.getElementById('gate').hidden||e.metaKey||e.ctrlKey||e.altKey)return;
    if(e.key==='ArrowLeft'){act('prev',e.target,null,e);e.preventDefault()}
    else if(e.key==='ArrowRight'){act('next',e.target,null,e);e.preventDefault()}
    else if(e.key==='n'||e.key==='N'){openOrderForm(null);e.preventDefault()}
  });
  // glisser sur tablette pour changer de jour
  let tx=null,ty=null;const mainEl=document.getElementById('main');
  mainEl.addEventListener('touchstart',e=>{if(e.target.closest('.wk-scroll,.tbl-wrap'))return;tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
  mainEl.addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;if(view.tab==='planning'&&Math.abs(dx)>80&&Math.abs(dy)<40)act(dx<0?'next':'prev',mainEl,null,e)});
  window.addEventListener('resize',placePop);
  let wasPhone=isPhone();window.addEventListener('resize',()=>{const p=isPhone();if(p!==wasPhone){wasPhone=p;render()}});
  setInterval(()=>{if(view.date===TODAY&&view.tab==='planning'&&view.mode==='jour')render()},60000);
}
let suppressClick=false;
if(typeof document!=='undefined'&&document.getElementById('main'))boot();
</script>
